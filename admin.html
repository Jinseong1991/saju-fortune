<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>명랑 관리자</title>
<style>
:root{--bg:#f4f2f8;--card:#fff;--ink:#241d38;--mute:#7a7290;--accent:#5146c8;--soft:#ecebfb;--line:#e6e1ef;--warn:#d23c4f;--ok:#1f9d6b}
@media (prefers-color-scheme:dark){:root{--bg:#121019;--card:#1c1826;--ink:#efeaf6;--mute:#a39bb7;--accent:#9d93ff;--soft:#2a2540;--line:#2f2a40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0 auto 0 0}
main{max-width:1280px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat b{display:block;font-size:26px;line-height:1.2}.stat span{color:var(--mute);font-size:12px}
.grid{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:14px;margin-top:14px;align-items:start}
.top{margin-top:14px}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.bar{height:10px;border-radius:99px;background:var(--accent);min-width:3px}
h2{font-size:15px;margin:0 0 10px}
input,select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
button{font:inherit;font-weight:700;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mute{color:var(--mute)}.err{color:var(--warn)}
.list{max-height:70vh;overflow:auto;margin:10px -14px -14px;border-top:1px solid var(--line)}
.u{display:block;width:100%;text-align:left;font-weight:400;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 14px;background:none}
.u:hover{background:var(--soft)}.u.on{background:var(--soft);box-shadow:inset 3px 0 var(--accent)}
.u b{display:block}.u small{color:var(--mute)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--line)}.dot.g{background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:2px 10px;border-radius:99px;background:var(--soft);font-size:12px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--card)}
td.n{white-space:nowrap}
.sec{margin-top:16px}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(20,15,35,.55);display:flex;justify-content:center;align-items:flex-start;padding:24px 12px;overflow:auto}
.modal>div{background:var(--card);border-radius:14px;max-width:820px;width:100%;padding:18px}
.rtext{white-space:pre-wrap;line-height:1.7;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}.kv span{color:var(--mute)}
button.sm{padding:3px 10px;font-size:12px}
@media (max-width:860px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.list{max-height:none}}
@media print{body.pm main{display:none}.modal{position:static;background:none;padding:0}header,.np,.side,.stats,.top{display:none!important}.grid{display:block}body{background:#fff;color:#000}.card{border:0}}
</style>
</head>
<body>
<header><h1>명랑 관리자</h1><span id="me" class="mute"></span><span id="hb" class="row"></span></header>
<main id="app"><div class="card"><p class="mute">불러오는 중…</p></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const CFG={"apiKey":"AIzaSyA79i9qg9Wkj1ZDqvOZqBjQpIoSriRqbpQ","authDomain":"myeongrang.firebaseapp.com","projectId":"myeongrang","storageBucket":"myeongrang.firebasestorage.app","messagingSenderId":"900703621281","appId":"1:900703621281:web:1dd00fd9acb3726a11a0e0"},NAV={"home":"홈","chart":"사주 원국·성격","life":"평생운·대운","bok":"타고난 복","shin":"신기·영감","gloss":"사주 용어 사전","today":"오늘의 운세","date":"지정일 운세·달력","month":"월별 운세","year":"연도별·월별 운세","toj":"토정비결","money":"재물운","love":"애정운","work":"직업·시험운","health":"건강운","style":"연애 스타일","marry":"결혼운","kids":"자녀운","face":"인연 몽타주","sok":"속궁합","people":"인연운·인맥","lucky":"오늘의 행운","bio":"바이오리듬","tarot":"타로","dream":"꿈해몽","west":"별자리·혈액형","mbti":"MBTI 검사·궁합","play":"포춘쿠키·고민 구슬","pick":"택일(좋은 날 찾기)","zodiac":"띠별 운세","match":"궁합","ai":"AI 질문지","prof":"프로필","set":"설정·테마"},RELT=['애인·부부','친구','직장 동료·상사','사업·동업','가족'],RDN=["애인","배우자","썸·호감","친구","선후배","직장 동료","직장 상사","부하 직원","사업 파트너·동업자","거래처·고객","아버지","어머니","아들","딸","형제·자매","할아버지","할머니","손주","장인","장모","시아버지","시어머니","사위","며느리","친척"],relName=x=>x==='me'?'본인':typeof x==='number'?RELT[x]||'':/^d[0-9]+$/.test(x||'')?RDN[+x.slice(1)]||'':'';
const $=id=>document.getElementById(id),app=$('app'),esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const p2=x=>String(x).padStart(2,'0'),dt=t=>{const d=new Date(t);return `${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}`};
const ago=t=>{if(!t)return '기록 없음';const m=(Date.now()-t)/6e4;return m<1?'방금':m<60?Math.floor(m)+'분 전':m<1440?Math.floor(m/60)+'시간 전':m<43200?Math.floor(m/1440)+'일 전':dt(t).slice(0,10)};
const plabel=v=>Array.isArray(v)?(v[0]||`${v[3]}.${v[4]}.${v[5]}`):'';
const pj=(t,d)=>{try{return JSON.parse(t)||d}catch(e){return d}};
const menu=v=>NAV[v]||v,DAY=864e5,today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
let USERS=[],SEL=null,SEEN=new Set(),F={q:'',sort:'recent'},D={from:'',to:'',menu:''};
function prep(id,x){const d=pj(x.data,{}),H=pj(d['saju-hist'],[]).filter(e=>e&&e.t).sort((a,b)=>b.t-a.t),P=pj(d['saju-prof'],[]),me=pj(d['saju-v1'],{}).a;
 return{id,email:x.email||'',name:x.name||'',t:+x.t||0,H,E:H,P,me,last:Math.max(+x.t||0,H[0]?H[0].t:0)}}
function count(H){const c={};for(const e of H)c[e.v]=(c[e.v]||0)+1;return Object.entries(c).sort((a,b)=>b[1]-a[1])}
function merge(u){const m=new Map(u.H.map(e=>[e.t,e]));for(const k in u.RS||{}){const x=u.RS[k];if(!m.has(+k))m.set(+k,{t:+k,v:x.v,a:x.a||null,b:pj(x.b,null),r:x.r>=0?x.r:null,d:x.rd||''})}u.E=[...m.values()].sort((a,b)=>b.t-a.t)}
function fmtP(p){return Array.isArray(p)?`${esc(plabel(p))} · ${p[1]==='f'?'여':'남'} · ${esc(p[3])}.${esc(p[4])}.${esc(p[5])}${String(p[2]).startsWith('l')?' (음력)':''} · ${p[6]?esc(p[6]):'시각 모름'}`:'-'}
function rows(H,o){const f=o.from?new Date(o.from+'T00:00').getTime():0,t=o.to?new Date(o.to+'T00:00').getTime()+DAY:0;
 return H.filter(e=>(!f||e.t>=f)&&(!t||e.t<t)&&(!o.menu||e.v===o.menu)).map(e=>({t:e.t,when:dt(e.t),menu:menu(e.v),who:e.a||'내 정보',other:plabel(e.b),rel:(e.r!=null&&RELT[e.r]||'')+(e.d?' · '+e.d:'')}))}
function showRes(id,t){const u=USERS.find(x=>x.id===id),x=u&&u.RS&&u.RS[t];if(!x)return;const L={ko:'한국어',en:'영어',ja:'일본어',zh:'중국어(간체)',tw:'중국어(번체)'};
 const m=document.createElement('div');m.className='modal';m.innerHTML=`<div><div class="row"><h2 style="margin:0 auto 0 0">${esc(x.m||menu(x.v))} 결과</h2><span class="np row"><button data-x="rprint">인쇄·PDF</button><button class="pri" data-x="rclose">닫기</button></span></div>
 <div class="kv" style="margin-top:10px"><span>이용자</span><b>${esc(u.name||u.email||u.id)}</b><span>본 시각</span><b>${dt(+x.t)}</b><span>화면 언어</span><b>${L[x.lang]||esc(x.lang)}</b><span>기준 인물</span><b>${esc(x.a||'내 정보')} — ${fmtP(pj(x.ad,null))}</b>${x.b?`<span>상대</span><b>${fmtP(pj(x.b,null))}</b>`:''}${x.r>=0&&RELT[x.r]?`<span>관계</span><b>${RELT[x.r]}${x.rd?' · '+esc(x.rd):''}</b>`:''}</div>
 <div class="rtext">${esc(x.text)}</div></div>`;document.body.appendChild(m);document.body.classList.add('pm')}
function csv(R){const q=x=>'"'+String(x).replace(/"/g,'""')+'"';return '﻿'+[['언제','메뉴','누구 기준','상대','관계'],...R.map(r=>[r.when,r.menu,r.who,r.other,r.rel])].map(a=>a.map(q).join(',')).join('\r\n')}
function bars(C,n){const max=C[0]?C[0][1]:1;return C.length?`<div class="bars">${C.slice(0,n).map(([v,k])=>`<span>${esc(menu(v))}</span><div class="bar" style="width:${Math.max(2,k/max*100)}%"></div><b>${k}</b>`).join('')}</div>`:'<p class="mute">아직 기록이 없습니다.</p>'}
function dash(){const t0=today0(),all=USERS.flatMap(u=>u.H),last30=all.filter(e=>e.t>=Date.now()-30*DAY);
 return `<div class="stats"><div class="card stat"><span>전체 이용자</span><b>${USERS.length}</b></div><div class="card stat"><span>오늘 이용</span><b>${USERS.filter(u=>u.last>=t0).length}</b></div><div class="card stat"><span>최근 7일 이용</span><b>${USERS.filter(u=>u.last>=Date.now()-7*DAY).length}</b></div><div class="card stat"><span>전체 기록</span><b>${all.length}</b></div></div>
 <div class="card top"><h2>인기 메뉴 <span class="mute" style="font-weight:400;font-size:12px">최근 30일 · ${last30.length}건</span></h2>${bars(count(last30),8)}</div>
 <div class="grid"><div class="card side"><div class="row"><input id="fq" placeholder="메일 · 이름 · UID 검색" style="flex:1;min-width:0" value="${esc(F.q)}"><select id="fs"><option value="recent">최근 이용순</option><option value="many">기록 많은 순</option><option value="name">이름순</option></select></div><div class="list" id="ul"></div></div><div class="card" id="dv"></div></div>`}
function ulist(){const q=F.q.trim().toLowerCase(),L=USERS.filter(u=>!q||(u.email+' '+u.name+' '+u.id).toLowerCase().includes(q)),t0=today0();
 L.sort(F.sort==='many'?(a,b)=>b.H.length-a.H.length:F.sort==='name'?(a,b)=>(a.name||a.email||a.id).localeCompare(b.name||b.email||b.id,'ko'):(a,b)=>b.last-a.last);
 $('ul').innerHTML=L.length?L.map(u=>`<button class="u${SEL===u.id?' on':''}" data-u="${esc(u.id)}"><b><span class="dot${u.last>=t0?' g':''}"></span>${esc(u.name||u.email||'(메일 없음 · 예전 판)')}</b><small>${esc(u.name?u.email:u.id)}</small><br><small>${ago(u.last)} · 기록 ${u.H.length} · 프로필 ${u.P.length}</small></button>`).join(''):'<p class="empty">찾는 이용자가 없습니다.</p>'}
function detail(){const u=USERS.find(x=>x.id===SEL),dv=$('dv');if(!u){dv.innerHTML='<p class="empty">왼쪽 목록에서 이용자를 고르세요.</p>';return}
 const R=rows(u.E,D),C=count(u.E),nr=u.RS?Object.keys(u.RS).length:0;u.R=R;
 dv.innerHTML=`<div class="row"><div style="margin-right:auto"><h2 style="margin:0">${esc(u.name||u.email||'(메일 없음)')}</h2><span class="mute">${esc(u.email)} · UID ${esc(u.id)}</span></div><span class="np row"><button data-x="csv">CSV 저장</button><button data-x="print">인쇄·PDF</button></span></div>
 <div class="row sec"><span class="chip">마지막 이용 ${ago(u.last)}</span><span class="chip">기록 ${u.E.length}건</span><span class="chip">저장된 결과 ${u.RS?nr+'건':'불러오는 중'}</span><span class="chip">프로필 ${u.P.length}명</span>${u.E.length?`<span class="chip">처음 기록 ${dt(u.E[u.E.length-1].t).slice(0,10)}</span>`:''}${u.rerr?`<span class="chip err">결과 불러오기 실패 ${esc(u.rerr)}</span>`:''}</div>
 <div class="sec"><h2>자주 본 메뉴</h2>${bars(C,6)}</div>
 <div class="sec"><h2>저장한 프로필</h2>${u.P.length?`<div class="tw"><table><tr><th>이름</th><th>나와의 관계</th><th>성별</th><th>생년월일</th><th>시각</th></tr>${u.P.map(p=>`<tr><td><b>${esc(plabel(p))}</b></td><td>${esc(relName(p[10]))||'<span class="mute">-</span>'}</td><td>${p[1]==='f'?'여':'남'}</td><td class="n">${esc(p[3])}.${esc(p[4])}.${esc(p[5])}${String(p[2]).startsWith('l')?' (음력)':''}</td><td>${p[6]?esc(p[6]):'모름'}</td></tr>`).join('')}</table></div>`:'<p class="mute">저장한 프로필이 없습니다.</p>'}</div>
 <div class="sec"><h2>이용 기록</h2><div class="row np"><label>기간 <input type="date" id="df" value="${D.from}"></label>~<input type="date" id="dt" value="${D.to}"><select id="dm"><option value="">모든 메뉴</option>${C.map(([v])=>`<option value="${esc(v)}"${D.menu===v?' selected':''}>${esc(menu(v))}</option>`).join('')}</select>${D.from||D.to||D.menu?'<button data-x="dclr">조건 지우기</button>':''}<span class="mute">${R.length}건</span></div>
 ${R.length?`<div class="tw" style="margin-top:8px"><table><tr><th>언제</th><th>메뉴</th><th>누구 기준</th><th>상대</th><th>관계</th><th>결과</th></tr>${R.map(r=>`<tr><td class="n">${r.when}</td><td><b>${esc(r.menu)}</b></td><td>${esc(r.who)}</td><td>${esc(r.other)}</td><td>${r.rel?`<span class="chip">${esc(r.rel)}</span>`:''}</td><td>${u.RS&&u.RS[r.t]?`<button class="sm pri" data-r="${r.t}">결과 보기</button>`:'<span class="mute">-</span>'}</td></tr>`).join('')}</table></div>`:'<p class="empty">조건에 맞는 기록이 없습니다.</p>'}</div>`}
async function pick(id){SEL=id;D={from:'',to:'',menu:''};ulist();detail();if(innerWidth<860)$('dv').scrollIntoView();
 {const u=USERS.find(x=>x.id===id);if(u&&!u.RS){firebase.firestore().collection('users').doc(id).collection('results').orderBy('t','desc').limit(500).get().then(s=>{u.RS={};for(const d of s.docs){const x=d.data();u.RS[+x.t]=x}},e=>{u.RS={};u.rerr=e.code||e.message}).then(()=>{merge(u);if(SEL===id)detail()})}}
 if(!SEEN.has(id)){SEEN.add(id);const u=USERS.find(x=>x.id===id),me=firebase.auth().currentUser;try{await firebase.firestore().collection('adminlog').add({admin:me.email,target:id,targetEmail:u&&u.email||'',t:Date.now()})}catch(e){}}}
async function load(){app.innerHTML='<div class="card"><p class="mute">이용자를 불러오는 중…</p></div>';
 try{const s=await firebase.firestore().collection('users').get();USERS=s.docs.map(d=>prep(d.id,d.data()));app.innerHTML=dash();$('fs').value=F.sort;ulist();detail()}
 catch(e){app.innerHTML='<div class="card"><p class="err">불러오지 못했습니다: '+esc(e.code||e.message)+'</p></div>'}}
function login(msg){$('me').textContent='';$('hb').innerHTML='';app.innerHTML='<div class="card" style="max-width:420px;margin:40px auto;text-align:center">'+(msg?`<p class="err">${esc(msg)}</p>`:'')+'<p>관리자 구글 계정으로 로그인하세요.</p><button class="pri" data-x="in">구글로 로그인</button><p class="mute" style="font-size:12px">이용자 본인이 요청한 경우에만 열람하세요. 이용자를 열어 볼 때마다 관리자 계정과 시각이 기록됩니다.</p></div>'}
document.addEventListener('click',async e=>{const u=e.target.closest('[data-u]');if(u)return pick(u.dataset.u);const rb=e.target.closest('[data-r]');if(rb)return showRes(SEL,+rb.dataset.r);if(e.target.classList.contains('modal')||e.target.closest('[data-x=rclose]')){document.querySelectorAll('.modal').forEach(m=>m.remove());document.body.classList.remove('pm');return}const b=e.target.closest('[data-x]');if(!b)return;const x=b.dataset.x;
 if(x==='in')try{await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(er){login('로그인하지 못했습니다 ('+(er.code||er.message)+')')}
 if(x==='out')firebase.auth().signOut();
 if(x==='reload')load();
 if(x==='print'||x==='rprint')print();
 if(x==='dclr'){D={from:'',to:'',menu:''};detail()}
 if(x==='csv'){const s=USERS.find(y=>y.id===SEL);if(!s)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv(s.R)],{type:'text/csv'}));a.download='명랑-이용기록-'+(s.email||s.id)+'.csv';a.click()}});
document.addEventListener('input',e=>{if(e.target.id==='fq'){F.q=e.target.value;ulist()}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='fs'){F.sort=e.target.value;ulist()}if(id==='df'||id==='dt'||id==='dm'){D[{df:'from',dt:'to',dm:'menu'}[id]]=e.target.value;detail()}});
if(window.firebase){firebase.initializeApp(CFG);firebase.auth().onAuthStateChanged(async u=>{USERS=[];SEL=null;if(!u)return login();
 try{const a=await firebase.firestore().collection('admins').doc(u.email).get();if(!a.exists){await firebase.auth().signOut();return login(u.email+' 계정은 관리자로 등록되어 있지 않습니다.')}
  $('me').textContent=u.email;$('hb').innerHTML='<button data-x="reload">새로고침</button><button data-x="out">로그아웃</button>';load()}
 catch(er){await firebase.auth().signOut();login('관리자 확인 실패 ('+(er.code||er.message)+')')}})}
