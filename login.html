<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>명랑 로그인</title>
<style>
:root{--bg:#fff4f6;--card:#fff;--ink:#2b2340;--mute:#7c7393;--accent:#e0567f;--line:#f3dbe3}
@media (prefers-color-scheme:dark){:root{--bg:#15121c;--card:#1f1a29;--ink:#efeaf6;--mute:#a59cb8;--line:#33294a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(circle at 20% 10%,#ffe0ea 0,transparent 45%),radial-gradient(circle at 85% 90%,#e3dcff 0,transparent 45%),var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 24px;text-align:center;box-shadow:0 24px 48px -28px rgba(120,60,100,.45)}
.logo{width:88px;height:88px;border-radius:22px;margin:0 auto 10px;display:block}
h1{margin:4px 0 2px;font-size:26px;letter-spacing:.02em}
p{margin:6px 0;color:var(--mute);font-size:14px;line-height:1.55}
button,a.btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;padding:13px 16px;border-radius:14px;font-weight:700;font-size:15px}
.g{background:#fff;color:#3c4043;border:1px solid #dadce0}
.go{background:var(--accent);color:#fff}
.err{color:#d23c4f}
.g svg{width:20px;height:20px}
</style>
</head>
<body>
<main class="box">
<img class="logo" src="icon.png" alt="">
<h1>명랑</h1>
<p>사주 · 운세</p>
<div id="v">
<p>구글 계정으로 로그인하면 내 정보와 설정을<br>PC와 휴대폰에서 함께 쓸 수 있어요.</p>
<button class="g" id="go"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>구글로 로그인</button>
</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const CFG={"apiKey":"AIzaSyA79i9qg9Wkj1ZDqvOZqBjQpIoSriRqbpQ","authDomain":"myeongrang.firebaseapp.com","projectId":"myeongrang","storageBucket":"myeongrang.firebasestorage.app","messagingSenderId":"900703621281","appId":"1:900703621281:web:1dd00fd9acb3726a11a0e0"};
const q=new URLSearchParams(location.search),from=q.get('from'),n=q.get('n')||'',v=document.getElementById('v');
if(!n||!/^(app|popup)$/.test(from)||(from==='popup'&&!window.opener)){v.innerHTML='<p>명랑 PC 프로그램이나 휴대폰 앱의 로그인 단추로 열어 주세요.</p>'}
firebase.initializeApp(CFG);
const go=document.getElementById('go');if(go)go.onclick=async()=>{
  try{
    const res=await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider());
    const gid=res.credential&&res.credential.idToken;
    if(!gid)throw new Error('토큰을 받지 못했습니다');
    if(from==='popup'&&window.opener){window.opener.postMessage({gid,n},'*');v.innerHTML='<p>로그인했어요! 이 창은 곧 닫힙니다.</p>';setTimeout(()=>window.close(),900);return}
    const AP={myeongrang:'app.saju.fortune',myeongrangad:'app.myeongrang.free',myeongrangpro:'app.myeongrang.pro'},sc=(q.get('a')||'myeongrang').split('|')[0],pk=AP[sc]||AP.myeongrang,scm=AP[sc]?sc:'myeongrang';
    const back='intent://login?t='+encodeURIComponent(gid)+'&n='+encodeURIComponent(n)+'#Intent;scheme='+scm+';package='+pk+';end';
    v.innerHTML='<p>로그인했어요!</p><a class="btn go" href="'+back+'">명랑 앱으로 돌아가기</a>';
    location.href=back;
  }catch(e){v.insertAdjacentHTML('beforeend','<p class="err">로그인하지 못했어요. 다시 눌러 주세요. ('+(e.code||e.message)+')</p>')}
};
</script>
</body>
</html>
